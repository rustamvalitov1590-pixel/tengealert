<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TengeAlert — OBS Wheel of Fortune Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700;800&family=Geist+Mono:wght@600;700;800&family=Inter:wght@500;600;700;800&family=Outfit:wght@700;800;900&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: transparent;
      overflow: hidden;
      font-family: 'Inter', -apple-system, sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .wheel-container {
      position: relative;
      width: 480px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Outer Glowing Aura & Pins Ring */
    .wheel-outer-ring {
      position: absolute;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.85);
      border: 6px solid #0f172a;
      pointer-events: none;
      z-index: 2;
    }

    /* Top Pointer / Ticker Arrow */
    .wheel-ticker {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 42px;
      z-index: 15;
      transform-origin: 50% 20%;
      transition: transform 0.08s ease-out;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
    }

    .wheel-ticker svg {
      width: 100%;
      height: 100%;
      fill: #e5a93c;
      stroke: #ffffff;
      stroke-width: 1.5;
    }

    .wheel-ticker.tick {
      transform: translateX(-50%) rotate(-18deg);
    }

    /* Canvas Wheel */
    #wheel-canvas {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      z-index: 5;
    }

    /* Center Hub */
    .wheel-hub {
      position: absolute;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fcd34d 0%, #b45309 80%, #78350f 100%);
      border: 4px solid #ffffff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(255, 255, 255, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 32px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    /* Winner Challenge Spotlight Modal */
    .winner-modal {
      position: absolute;
      width: 380px;
      padding: 24px 20px;
      background: linear-gradient(150deg, rgba(15, 23, 42, 0.96) 0%, rgba(3, 7, 18, 0.98) 100%);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.95);
      border-radius: 20px;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      opacity: 0;
      transform: scale(0.85);
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px);
    }

    .winner-modal.show {
      opacity: 1;
      transform: scale(1);
      pointer-events: auto;
      animation: modalPop 0.5s ease;
    }

    @keyframes modalPop {
      0% { transform: scale(0.7); opacity: 0; }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }

    .winner-badge {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 800;
      color: #00f5a0;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(0, 245, 160, 0.15);
      border: 1px solid rgba(0, 245, 160, 0.3);
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    .winner-challenge {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.25;
      margin-bottom: 8px;
      text-shadow: 0 0 20px rgba(0, 245, 160, 0.5);
    }

    .winner-meta {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 12px;
    }

    .winner-meta span {
      color: #f1f5f9;
      font-weight: 700;
    }

    .winner-amount {
      color: #e5a93c !important;
      font-family: 'Geist Mono', monospace;
    }

    .winner-timer-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
    }

    .winner-timer-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(90deg, #00f5a0 0%, #22d3ee 100%);
      transition: width 6.5s linear;
    }
  </style>
</head>
<body>

  <div class="wheel-container" id="wheel-box" title="Нажмите для тестового вращения">
    <!-- Ticker Needle -->
    <div class="wheel-ticker" id="ticker">
      <svg viewBox="0 0 24 32">
        <path d="M12 32 L2 10 A 10 10 0 0 1 22 10 Z" />
      </svg>
    </div>

    <!-- Outer Ring -->
    <div class="wheel-outer-ring"></div>

    <!-- Canvas -->
    <canvas id="wheel-canvas" width="880" height="880"></canvas>

    <!-- Center Tenge Hub -->
    <div class="wheel-hub">₸</div>

    <!-- Winner Modal -->
    <div class="winner-modal" id="winner-card">
      <div class="winner-badge">ВЫПАВШИЙ ЧЕЛЛЕНДЖ</div>
      <div class="winner-challenge" id="win-challenge">20 отжиманий</div>
      <div class="winner-meta">
        От: <span id="win-donor">Данияр К.</span> (<span class="winner-amount" id="win-amount">2 500 ₸</span>)
      </div>
      <div class="winner-timer-bar">
        <div class="winner-timer-fill" id="win-timer"></div>
      </div>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const streamerToken = urlParams.get('token') || '';

    // Wheel state
    let sectors = [
      '20 отжиманий',
      'Спеть куплет',
      'Играть с пистолетом',
      'Мут на 5 минут',
      '+30 мин к стриму',
      'Без брони',
      'Случайный дроп',
      'Острый перекус'
    ];

    const sectorColors = [
      '#00f5a0', '#00d9f5', '#a855f7', '#ff0055',
      '#e5a93c', '#3b82f6', '#ec4899', '#10b981'
    ];

    const canvas = document.getElementById('wheel-canvas');
    const ctx = canvas.getContext('2d');
    const ticker = document.getElementById('ticker');
    const winnerCard = document.getElementById('winner-card');

    let currentAngle = 0; // in radians
    let isSpinning = false;
    let lastPassedSector = -1;

    // Procedural Web Audio Ticker & Fanfare
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTick() {
      try {
        const c = getAudioCtx();
        const now = c.currentTime;
        const osc = c.createOscillator();
        const gain = c.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(300, now + 0.04);

        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        osc.connect(gain);
        gain.connect(c.destination);

        osc.start(now);
        osc.stop(now + 0.04);

        ticker.classList.add('tick');
        setTimeout(() => ticker.classList.remove('tick'), 40);
      } catch (e) {}
    }

    function playWinFanfare() {
      try {
        const c = getAudioCtx();
        const now = c.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = c.createOscillator();
          const g = c.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);

          g.gain.setValueAtTime(0.3, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 1.2);

          osc.connect(g);
          g.connect(c.destination);

          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 1.2);
        });
      } catch (e) {}
    }

    function drawWheel() {
      const numSectors = sectors.length;
      const arc = (2 * Math.PI) / numSectors;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = cx - 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(currentAngle);

      for (let i = 0; i < numSectors; i++) {
        const angle = i * arc;
        ctx.beginPath();
        ctx.fillStyle = sectorColors[i % sectorColors.length];
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, angle, angle + arc);
        ctx.lineTo(0, 0);
        ctx.fill();

        // Slice borders
        ctx.strokeStyle = '#090d16';
        ctx.lineWidth = 4;
        ctx.stroke();

        // Inner shadow effect
        ctx.beginPath();
        ctx.arc(0, 0, r - 8, angle, angle + arc);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 3;
        ctx.stroke();

        // Sector text
        ctx.save();
        ctx.rotate(angle + arc / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#06080e';
        ctx.font = 'bold 26px "Outfit", sans-serif';
        ctx.shadowColor = 'rgba(255, 255, 255, 0.4)';
        ctx.shadowBlur = 4;

        // Truncate text if needed
        let label = sectors[i];
        if (label.length > 18) label = label.substring(0, 16) + '…';
        ctx.fillText(label, r - 35, 9);
        ctx.restore();
      }

      ctx.restore();
    }

    // Physics rotation to land on targetIndex
    function spinTo(targetIndex, donorInfo = null) {
      if (isSpinning) return;
      isSpinning = true;
      winnerCard.classList.remove('show');

      const numSectors = sectors.length;
      const arc = (2 * Math.PI) / numSectors;

      // Pointer is at 12 o'clock (angle 3 * PI / 2)
      // To land targetIndex at 12 o'clock:
      // (currentAngle + totalRotation + targetIndex * arc + arc/2) % (2*PI) == 3*PI/2
      const pointerAngle = (3 * Math.PI) / 2;
      const targetSectorCenter = targetIndex * arc + arc / 2;

      // Desired final angle mod 2*PI:
      let desiredNormalized = (pointerAngle - targetSectorCenter) % (2 * Math.PI);
      if (desiredNormalized < 0) desiredNormalized += 2 * Math.PI;

      const currentNormalized = currentAngle % (2 * Math.PI);
      let diff = desiredNormalized - currentNormalized;
      if (diff < 0) diff += 2 * Math.PI;

      // Add 5 to 7 full revolutions for dramatic suspense
      const extraRevolutions = (5 + Math.floor(Math.random() * 2)) * (2 * Math.PI);
      const totalRotation = extraRevolutions + diff;

      const duration = 6500; // ms
      const startAngle = currentAngle;
      const startTime = performance.now();

      function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(1, elapsed / duration);

        // Quintic ease-out curve for realistic deceleration
        const ease = 1 - Math.pow(1 - progress, 4.5);
        currentAngle = startAngle + totalRotation * ease;

        // Check pins tick
        const effectivePointerAngle = (pointerAngle - currentAngle) % (2 * Math.PI);
        const normEffective = (effectivePointerAngle + 2 * Math.PI) % (2 * Math.PI);
        const curSector = Math.floor(normEffective / arc);

        if (curSector !== lastPassedSector) {
          lastPassedSector = curSector;
          playTick();
        }

        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          isSpinning = false;
          playWinFanfare();
          showWinner(targetIndex, donorInfo);
        }
      }

      requestAnimationFrame(animate);
    }

    function showWinner(index, donorInfo) {
      const challenge = sectors[index];
      document.getElementById('win-challenge').textContent = challenge;
      document.getElementById('win-donor').textContent = donorInfo?.donor || 'Зритель Kaspi';
      const amount = (donorInfo?.amount || 1000).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
      document.getElementById('win-amount').textContent = `${amount} ₸`;

      const timerEl = document.getElementById('win-timer');
      timerEl.style.transition = 'none';
      timerEl.style.width = '100%';

      winnerCard.classList.add('show');

      setTimeout(() => {
        timerEl.style.transition = 'width 6.5s linear';
        timerEl.style.width = '0%';
      }, 50);

      setTimeout(() => {
        winnerCard.classList.remove('show');
      }, 6800);
    }

    // Fetch streamer wheel settings
    function fetchWheel() {
      fetch(`/api/widgets/wheel${streamerToken ? '?token=' + encodeURIComponent(streamerToken) : ''}`)
        .then(r => r.json())
        .then(d => {
          if (d && d.wheel && d.wheel.sectors) {
            sectors = d.wheel.sectors;
            drawWheel();
          }
        })
        .catch(() => drawWheel());
    }

    // Connect to Server SSE
    const sseUrl = `/api/events${streamerToken ? '?token=' + encodeURIComponent(streamerToken) : ''}`;
    const eventSource = new EventSource(sseUrl);

    eventSource.addEventListener('wheel_spin', (e) => {
      try {
        const data = JSON.parse(e.data);
        const idx = data.sector_index !== undefined ? data.sector_index : Math.floor(Math.random() * sectors.length);
        spinTo(idx, data);
      } catch (err) {}
    });

    eventSource.addEventListener('wheel_settings_updated', (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.sectors) {
          sectors = data.sectors;
          drawWheel();
        }
      } catch (err) {}
    });

    // Manual test on click or Space
    document.getElementById('wheel-box').addEventListener('click', () => {
      const randIndex = Math.floor(Math.random() * sectors.length);
      spinTo(randIndex, { donor: 'Тестовый Донатер', amount: 2500 });
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'Enter') {
        const randIndex = Math.floor(Math.random() * sectors.length);
        spinTo(randIndex, { donor: 'Азамат Б.', amount: 5000 });
      }
    });

    // Initialize
    fetchWheel();
    drawWheel();
  </script>
</body>
</html>
